[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mentor-core"
version = "0.1.0"
description = "Evidence-backed public knowledge for practical guidance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "DATA-LICENSE.md"]
dependencies = ["jsonschema>=4.20,<5", "brotli>=1.1,<2"]

[project.urls]
Repository = "https://github.com/gdpu11/open-mentor"
Issues = "https://github.com/gdpu11/open-mentor/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
media = ["yt-dlp[default]>=2025.1.26"]
asr = ["faster-whisper>=1.1,<2"]
asr-mlx = ["mlx-whisper>=0.4,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
open-mentor = "open_mentor.cli:main"

[tool.setuptools.packages.find]
include = ["open_mentor*"]

[tool.setuptools.package-data]
open_mentor = ["data/*.json", "data/people/*.json"]
